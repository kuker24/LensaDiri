<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="LensaDiri">
  <!-- Monochrome lens mark: concentric aperture on void -->
  <rect width="32" height="32" rx="6" fill="#000000"/>
  <circle cx="16" cy="16" r="11.25" stroke="#e2e2e2" stroke-width="1.5" opacity="0.95"/>
  <circle cx="16" cy="16" r="7.25" stroke="#e2e2e2" stroke-width="1.25" opacity="0.55"/>
  <circle cx="16" cy="16" r="3.1" fill="#e2e2e2"/>
  <!-- soft highlight = reflection on glass -->
  <path d="M12.2 12.1c1.4-1.3 3.3-1.9 5.1-1.6" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
</svg>
